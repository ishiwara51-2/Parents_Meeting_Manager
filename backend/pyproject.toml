[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-scheduler-backend"
version = "0.1.0"
description = "保護者面談調整ツール（プロトタイプ）バックエンド"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2",
    "pydantic-settings>=2",
    "pytest>=8",
    "httpx>=0.27",
    "google-auth>=2.29",
    "google-auth-oauthlib>=1.2",
    "google-api-python-client>=2.130",
    "itsdangerous>=2.2",
    "ortools>=9.10",
    "reportlab>=4.0",
    "pypdf>=4.0",
    "openpyxl>=3.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
markers = [
    "slow: パフォーマンステスト等の重いテスト。通常実行から除外したい場合は `pytest -m \"not slow\"` を使用",
]
